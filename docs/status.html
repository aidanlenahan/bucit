<html>
<head>

<style>
:root{ --brand: #800000; }
body{ background: var(--brand); color:#fff; }
nav{ background: #5a0000; padding: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
nav div{ max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; align-items: center; padding: 0 20px; }
nav a{ color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 4px; transition: background 0.2s; }
nav a:hover{ background: rgba(255,255,255,0.1); }
nav a.active{ background: rgba(255,255,255,0.15); }
.container{ max-width: 720px; margin: 48px auto; background: rgba(255,255,255,0.98); padding: 24px; border-radius: 8px; color:#222; }
.ticket-box{ padding: 12px; border-radius: 8px; border: 1px solid #ddd; background:#fff; }
.container-header{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.new-ticket-btn{ background:var(--brand); color:#fff; text-decoration:none; padding:10px 16px; border-radius:6px; font-weight:600; border:1px solid #5a0000; }
.new-ticket-btn:hover{ background:#5a0000; }
.demo-hint{ font-size: 13px; color:#666; margin-top: 8px; }
/* Google Translate Styling */
#google_translate_element { display: inline-block; }
.goog-te-gadget { font-family: Arial, sans-serif; font-size: 0; }
.goog-te-gadget-simple { background-color: transparent !important; border: none !important; padding: 0 !important; cursor: pointer; font-size: 14px !important; }
.goog-te-gadget-simple:hover { opacity: 0.8; }
.goog-te-gadget-simple .goog-te-menu-value span { color: #ccc !important; }
.goog-te-gadget-simple .goog-te-menu-value span:first-child { display: none; }
.goog-te-gadget-icon { display: none !important; }
.goog-te-menu-value:before { content: "🌐"; font-size: 18px; margin-right: 6px; }
.goog-te-menu-value span:nth-child(3) { border-left: none !important; color: #ccc !important; }
</style>
<script src="js/seed-data.js"></script>
<script src="js/demo.js"></script>
</head>
<body><nav>
  <div>
    <a href="index.html" style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.2em; margin-right: 10px;">
      <img src="img/buc.svg" alt="BucIT Logo" style="height: 32px; width: 32px;">
      <span>BucIT</span>
    </a>
    <a href="index.html">Home</a>
    <a href="form.html">Intake Form</a>
    <a href="status.html" class="active">Ticket Status</a>
    <a href="chatbot.html">Chatbot</a>
    <a href="articles/index.html">Articles</a>
    <a href="support.html">Support</a>
    <div id="google_translate_element" style="margin-left: auto;"></div>
  </div>
</nav>    <div class="container">
        <div class="container-header">
            <h1 style="margin:0;">Check your ticket</h1>
            <a class="new-ticket-btn" href="form.html">+ New Ticket</a>
        </div>
        <p>Enter your ticket ID to check the status and updates.</p>
        <form method="GET">
            <label for="id">Ticket ID</label>
            <input type="text" id="id" name="id" value="" required pattern="\d{1,6}" maxlength="6" inputmode="numeric" title="Enter a valid ticket ID (up to 6 digits)">
            <button type="submit">Check</button>
        </form>
        <p class="demo-hint">Demo: try ticket <a href="?id=1010">1010</a> (closed), <a href="?id=1030">1030</a> or <a href="?id=1045">1045</a>.</p>

        <div id="result"></div>
    </div>
  <script>
    // Port of status.php
    (function () {
      const esc = Bucit.esc;
      let ticketId = (Bucit.param('id') || '').trim();
      let ticket = null;
      let notFound = false;
      let showSpecialPopup = false;

      if (ticketId !== '') {
        if (ticketId === '67') {
          showSpecialPopup = true;
        }
        if (!/^\d+$/.test(ticketId) || parseInt(ticketId, 10) <= 0) {
          ticketId = '';
          notFound = true;
        } else if (ticketId.length > 6) {
          ticketId = ticketId.slice(0, 6);
        } else if (ticketId === '263450' || ticketId === '263497') {
          window.location.replace('tech/login.html');
          return;
        }
      }

      if (ticketId !== '' && !notFound) {
        ticket = Bucit.ticketById(ticketId);
        if (!ticket) notFound = true;
      }

      document.getElementById('id').value = ticketId;
      const out = document.getElementById('result');
      let html = '';
      if (ticket) {
        html += '<div style="margin-top: 20px;" class="ticket-box">';
        html += '<h2>Ticket #' + esc(ticket.id) + ' — ' + esc(ticket.status) + '</h2>';
        html += '<p><strong>Name:</strong> ' + esc(ticket.first_name + ' ' + ticket.last_name) + '</p>';
        html += '<p><strong>Date reported:</strong> ' + Bucit.formatDate(ticket.date_reported, 'M d, Y') + '</p>';
        html += '<p><strong>Problem:</strong> ' + esc(ticket.problem_category) + '</p>';
        if (ticket.custom_detail) html += '<p><strong>Details:</strong> ' + esc(ticket.custom_detail) + '</p>';
        if (ticket.chromebook_sn) html += '<p><strong>Chromebook SN:</strong> ' + esc(ticket.chromebook_sn) + '</p>';
        if (ticket.picked_up) html += '<p><strong>Picked Up:</strong> ' + esc(ticket.picked_up) + '</p>';
        if (ticket.picked_up === 'Yes' && ticket.pickup_date) html += '<p><strong>Pickup Date:</strong> ' + Bucit.formatDate(ticket.pickup_date, 'M d, Y') + '</p>';
        if (ticket.notes) html += '<p><strong>Notes:</strong> ' + Bucit.nl2br(ticket.notes) + '</p>';
        html += '<p><a href="form.html">Submit a new ticket</a></p></div>';
      } else if (notFound) {
        html += '<div style="margin-top: 20px;" class="ticket-box">No ticket found with ID ' + esc(ticketId) + '</div>';
      }
      if (showSpecialPopup) {
        html += '<div id="specialPopup" style="margin-top: 20px; padding: 16px; background-color: #fff3cd; border-left: 4px solid #ffc107; color: #856404; border-radius: 4px;">676767676767676767676767676767676767</div>';
      }
      out.innerHTML = html;

      if (showSpecialPopup) {
        setTimeout(function () {
          const popup = document.getElementById('specialPopup');
          if (popup) {
            popup.style.transition = 'opacity 0.3s';
            popup.style.opacity = '0';
            setTimeout(function () { popup.remove(); }, 300);
          }
        }, 2000);
      }
    })();
  </script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,es,zh-CN,ar,fr,de,it,ja,ko,pt,ru,vi',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
