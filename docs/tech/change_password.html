<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password</title>
<link rel="icon" type="image/svg+xml" href="../img/buc.svg">
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/seed-data.js"></script>
<script src="../js/demo.js"></script>
</head>
<body>
<div style="max-width:520px;margin:40px auto;background:#fff;padding:20px;border-radius:8px">
<h2>Change Password for <span id="username"></span></h2>
<div id="messages"></div>
<form method="POST" id="pw-form">
  <label>Current password</label>
  <input name="current_password" type="password" required>
  <label>New password</label>
  <input name="new_password" type="password" required>
  <label>Confirm new password</label>
  <input name="confirm_password" type="password" required>
  <div style="margin-top:12px">
    <button type="submit" class="btn">Change Password</button>
    <a href="manage_tickets.html" style="margin-left:8px">Back</a>
    <a href="logout.html" style="margin-left:8px">Log out</a>
  </div>
</form>
</div>
<script>
  // Port of tech/change_password.php
  (function () {
    const s = Bucit.requireTech();
    if (!s) return;
    document.getElementById('username').textContent = s.tech_user;
    const box = document.getElementById('messages');
    const form = document.getElementById('pw-form');
    function show(error, success) {
      box.innerHTML = (error ? '<div style="color:#721c24;background:#f8d7da;padding:10px;border-radius:4px">' + Bucit.esc(error) + '</div>' : '')
        + (success ? '<div style="color:#155724;background:#d4edda;padding:10px;border-radius:4px">' + Bucit.esc(success) + '</div>' : '');
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const current = form.current_password.value;
      const next = form.new_password.value;
      const confirm = form.confirm_password.value;
      if (next === '' || confirm === '' || current === '') return show('All fields are required.');
      if (next !== confirm) return show('New password and confirmation do not match.');
      const row = Bucit.techByUsername(s.tech_user);
      if (!row) return show('Account not found.');
      if (row.password !== current) return show('Current password is incorrect.');
      row.password = next;
      row.must_change_password = 0;
      Bucit.save();
      s.must_change_password = 0;
      Bucit.setSession(s);
      form.reset();
      show(null, 'Password changed successfully.');
    });
  })();
</script>
</body></html>
