<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technician Login</title>
<link rel="icon" type="image/svg+xml" href="../img/buc.svg">
<link rel="stylesheet" href="../css/styles.css">
<style>
.demo-accounts { margin-top: 18px; padding: 12px 14px; border-radius: 8px; background: #fff3cd; color: #5c4400; border-left: 4px solid #ffc107; font-size: 14px; line-height: 1.5; }
.demo-accounts p { margin: 0 0 6px; }
.demo-accounts ul { margin: 0; padding-left: 18px; }
.demo-accounts button { width: auto; padding: 0; margin: 0; border: 0; background: none; color: #800000; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
</style>
<script src="../js/seed-data.js"></script>
<script src="../js/demo.js"></script>
</head>
<body class="login-page">
<main class="login-card">
<h2>Technician Login</h2>
<div id="login-error"></div>
<form method="POST" class="login-form" id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <div class="login-actions">
        <button type="submit" class="btn">Log in</button>
        <a href="../index.html" class="login-back-link">Back</a>
    </div>
</form>
<div class="demo-accounts">
    <p><strong>Demo accounts</strong> (password <code>demo</code> for all):</p>
    <ul>
        <li><button type="button" data-user="arivera">arivera</button> technician</li>
        <li><button type="button" data-user="admin">admin</button> admin (account management, point overrides)</li>
    </ul>
</div>
</main>
<script>
  // Port of tech/login.php
  (function () {
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    function showError(message) {
      errorBox.innerHTML = '<div class="login-alert">' + Bucit.esc(message) + '</div>';
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const result = Bucit.login(form.username.value, form.password.value);
      if (!result.ok) {
        showError(result.error);
        return;
      }
      window.location.href = result.session.must_change_password ? 'change_password.html' : 'manage_tickets.html';
    });
    document.querySelectorAll('[data-user]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        form.username.value = btn.dataset.user;
        form.password.value = 'demo';
        form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true }));
      });
    });
  })();
</script>
</body>
</html>
